name: Build Zygisk Mod Menu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_CMAKE_HOME=/usr/local/lib/android/sdk/cmake/3.22.1/bin" >> $GITHUB_ENV

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Find all zip files
        run: find . -name "*.zip" -type f

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: modmenu-zip
          path: |
            **/out/*.zip
            **/*.zip
          if-no-files-found: error
