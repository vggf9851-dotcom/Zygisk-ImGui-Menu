name: Build Mod Menu

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;23.1.7779620 cmake;3.18.1'

      - name: Show project structure
        run: |
          echo "=== Root directory ==="
          ls -la
          echo "=== module directory ==="
          ls -la module/ || echo "No module dir"
          echo "=== gradle files ==="
          cat settings.gradle
          cat build.gradle

      - name: Build with full debug
        run: |
          chmod +x gradlew
          ./gradlew :module:assembleRelease --info --stacktrace

      - name: Show build outputs
        if: always()
        run: |
          echo "=== Build outputs ==="
          find . -name "*.zip" -o -name "*.apk" 2>/dev/null

      - name: Upload Mod Menu Zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zycheats-modmenu
          path: out/zycheats-v1.0-release.zip
          if-no-files-found: error
