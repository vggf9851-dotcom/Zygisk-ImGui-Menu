name: Build Mod Menu

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Module
        run: |
          chmod +x gradlew
          ./gradlew :module:assembleRelease --stacktrace

      - name: Find all ZIP files
        if: always()
        run: |
          echo "=== Searching for ZIP files ==="
          find . -name "*.zip" -type f 2>/dev/null
          echo "=== Searching for outputs directory ==="
          find . -type d -name "outputs" 2>/dev/null
          echo "=== Module build directory ==="
          ls -la module/build/ 2>/dev/null || echo "No module/build"
          echo "=== Out directory ==="
          ls -la out/ 2>/dev/null || echo "No out/"

      - name: Upload Everything ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modmenu-zip
          path: |
            **/*.zip
            !**/gradle-wrapper.zip
            !**/gradle*.zip
          if-no-files-found: error
